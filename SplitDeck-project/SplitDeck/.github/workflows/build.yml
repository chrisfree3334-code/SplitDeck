name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
defaults:
  run:
    working-directory: SplitDeck-project/SplitDeck
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project SplitDeck.xcodeproj -scheme SplitDeck \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SplitDeck.app Payload/
          zip -r SplitDeck.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SplitDeck-ipa
          path: SplitDeck-project/SplitDeck/SplitDeck.ipa
