name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # every Monday: rebuild with fresh filter lists
defaults:
  run:
    working-directory: SplitDeck-project/SplitDeck
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build ad-block lists
        run: python3 ../../tools/build_blocklists.py Sources/Blocklists
      - name: Check lists compile in WebKit
        run: |
          swiftc -swift-version 5 -O ../../tools/validate_blocklists.swift -o validate_blocklists
          ls Sources/Blocklists/sd-*.json >/dev/null 2>&1 && ./validate_blocklists Sources/Blocklists/sd-*.json || echo "No lists to check"
      - name: Compress lists
        run: python3 ../../tools/compress_blocklists.py Sources/Blocklists
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          # Compile errors are reported as notes on the run, since the full log isn't always reachable.
          if ! xcodebuild -project SplitDeck.xcodeproj -scheme SplitDeck \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1; then
            grep -E "error:" build.log | sort -u | head -20 | while IFS= read -r l; do echo "::error title=Compile error::${l##*/Sources/}"; done
            tail -30 build.log
            exit 1
          fi
          tail -3 build.log
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SplitDeck.app Payload/
          codesign -f -s - --entitlements Sources/SplitDeck.entitlements Payload/SplitDeck.app
          zip -qr SplitDeck.ipa Payload
          # Size report, shown as notes on the run.
          echo "::notice title=App size::$(du -sk Payload/SplitDeck.app | cut -f1) KB installed, $(du -sk SplitDeck.ipa | cut -f1) KB download"
          find Payload/SplitDeck.app -type f -size +200k -exec du -k {} + | sort -rn | head -8 | while read k f; do echo "::notice title=Large file::${k} KB ${f#Payload/SplitDeck.app/}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: SplitDeck-1.2-build-${{ github.run_number }}
          path: SplitDeck-project/SplitDeck/SplitDeck.ipa

  launch-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and compress lists
        run: |
          python3 ../../tools/build_blocklists.py Sources/Blocklists || true
          python3 ../../tools/compress_blocklists.py Sources/Blocklists || true
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for the simulator (same Release settings as the device build)
        run: |
          xcodebuild -project SplitDeck.xcodeproj -scheme SplitDeck \
            -configuration Release -sdk iphonesimulator -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > simbuild.log 2>&1 || { tail -20 simbuild.log; exit 1; }
          codesign -f -s - simbuild/Build/Products/Release-iphonesimulator/SplitDeck.app
      - name: Launch in the simulator
        run: ../../tools/smoke_test.sh simbuild/Build/Products/Release-iphonesimulator/SplitDeck.app
